<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Batch 2 Uncropped Screenshot Contact Sheet</title>
		<style>
			:root {
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				color: #17181a;
				background: #f5f6f8;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 24px;
			}

			h1 {
				margin: 0 0 18px;
				font-size: 22px;
			}

			.variant {
				margin-block-end: 28px;
			}

			.variant h2 {
				margin: 0 0 10px;
				font-size: 18px;
			}

			.grid {
				display: grid;
				grid-template-columns: 320px 420px minmax(0, 1fr);
				gap: 16px;
				align-items: start;
			}

			.card {
				overflow: hidden;
				border: 1px solid #d9dde4;
				border-radius: 8px;
				background: #fff;
				box-shadow: 0 14px 32px rgba(23, 24, 26, 0.08);
			}

			.card h3 {
				margin: 0;
				border-bottom: 1px solid #d9dde4;
				padding: 10px 12px;
				font-size: 14px;
			}

			.card img {
				display: block;
				inline-size: 100%;
				block-size: auto;
			}
		</style>
	</head>
	<body>
		<h1>Batch 2 DryUI Build Skill Experiments - Uncropped</h1>

		<section class="variant">
			<h2>Variant 1 - Shell Gated</h2>
			<div class="grid">
				<div class="card">
					<h3>Mobile</h3>
					<img src="variant-1-mobile.png" alt="Variant 1 mobile" />
				</div>
				<div class="card">
					<h3>Tablet</h3>
					<img src="variant-1-tablet.png" alt="Variant 1 tablet" />
				</div>
				<div class="card">
					<h3>Desktop</h3>
					<img src="variant-1-desktop.png" alt="Variant 1 desktop" />
				</div>
			</div>
		</section>

		<section class="variant">
			<h2>Variant 2 - Router Compact</h2>
			<div class="grid">
				<div class="card">
					<h3>Mobile</h3>
					<img src="variant-2-mobile.png" alt="Variant 2 mobile" />
				</div>
				<div class="card">
					<h3>Tablet</h3>
					<img src="variant-2-tablet.png" alt="Variant 2 tablet" />
				</div>
				<div class="card">
					<h3>Desktop</h3>
					<img src="variant-2-desktop.png" alt="Variant 2 desktop" />
				</div>
			</div>
		</section>

		<section class="variant">
			<h2>Variant 3 - Visual Tournament</h2>
			<div class="grid">
				<div class="card">
					<h3>Mobile</h3>
					<img src="variant-3-mobile.png" alt="Variant 3 mobile" />
				</div>
				<div class="card">
					<h3>Tablet</h3>
					<img src="variant-3-tablet.png" alt="Variant 3 tablet" />
				</div>
				<div class="card">
					<h3>Desktop</h3>
					<img src="variant-3-desktop.png" alt="Variant 3 desktop" />
				</div>
			</div>
		</section>

		<section class="variant">
			<h2>Variant 4 - Dashboard Recipes</h2>
			<div class="grid">
				<div class="card">
					<h3>Mobile</h3>
					<img src="variant-4-mobile.png" alt="Variant 4 mobile" />
				</div>
				<div class="card">
					<h3>Tablet</h3>
					<img src="variant-4-tablet.png" alt="Variant 4 tablet" />
				</div>
				<div class="card">
					<h3>Desktop</h3>
					<img src="variant-4-desktop.png" alt="Variant 4 desktop" />
				</div>
			</div>
		</section>
	</body>
</html>
