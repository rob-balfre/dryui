<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Batch 2 Screenshot Contact Sheet</title>
		<style>
			:root {
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				color: #17181a;
				background: #f5f6f8;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 24px;
			}

			h1 {
				margin: 0 0 18px;
				font-size: 22px;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 18px;
			}

			.card {
				overflow: hidden;
				border: 1px solid #d9dde4;
				border-radius: 8px;
				background: #fff;
				box-shadow: 0 14px 32px rgba(23, 24, 26, 0.08);
			}

			.card h2 {
				margin: 0;
				border-bottom: 1px solid #d9dde4;
				padding: 10px 12px;
				font-size: 14px;
			}

			.card img {
				display: block;
				width: 100%;
				height: 360px;
				object-fit: cover;
				object-position: top left;
			}
		</style>
	</head>
	<body>
		<h1>Batch 2 DryUI Build Skill Experiments</h1>
		<div class="grid">
			<div class="card">
				<h2>V1 Mobile</h2>
				<img src="variant-1-mobile.png" alt="V1 mobile" />
			</div>
			<div class="card">
				<h2>V1 Tablet</h2>
				<img src="variant-1-tablet.png" alt="V1 tablet" />
			</div>
			<div class="card">
				<h2>V1 Desktop</h2>
				<img src="variant-1-desktop.png" alt="V1 desktop" />
			</div>
			<div class="card">
				<h2>V2 Mobile</h2>
				<img src="variant-2-mobile.png" alt="V2 mobile" />
			</div>
			<div class="card">
				<h2>V2 Tablet</h2>
				<img src="variant-2-tablet.png" alt="V2 tablet" />
			</div>
			<div class="card">
				<h2>V2 Desktop</h2>
				<img src="variant-2-desktop.png" alt="V2 desktop" />
			</div>
			<div class="card">
				<h2>V3 Mobile</h2>
				<img src="variant-3-mobile.png" alt="V3 mobile" />
			</div>
			<div class="card">
				<h2>V3 Tablet</h2>
				<img src="variant-3-tablet.png" alt="V3 tablet" />
			</div>
			<div class="card">
				<h2>V3 Desktop</h2>
				<img src="variant-3-desktop.png" alt="V3 desktop" />
			</div>
			<div class="card">
				<h2>V4 Mobile</h2>
				<img src="variant-4-mobile.png" alt="V4 mobile" />
			</div>
			<div class="card">
				<h2>V4 Tablet</h2>
				<img src="variant-4-tablet.png" alt="V4 tablet" />
			</div>
			<div class="card">
				<h2>V4 Desktop</h2>
				<img src="variant-4-desktop.png" alt="V4 desktop" />
			</div>
		</div>
	</body>
</html>
